openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /event-webhook:
    post:
      operationId: eventPaymentWebhook
      summary: Reconcile completed event payments verified with PayPal
      security: []
      description: Requires PayPal transmission headers verified against PAYPAL_WEBHOOK_ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayPalWebhookEvent"
      responses:
        "200":
          description: Reconciled or ignored non-event payment
        "400":
          description: Invalid event
        "401":
          description: Invalid PayPal signature
        "409":
          description: Payment mismatch or registration conflict; requires investigation
        "503":
          description: Configuration or temporary provider/database failure; retry delivery
  /event:
    post:
      operationId: eventWorkflow
      summary: Guest event bookings and payments, with Firebase-authenticated administrator review
      security:
        - firebaseBearer: []
        - eventGuest: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventActionRequest"
      responses:
        "200":
          description: Action result; onlineTelegramUrl is returned only for an owned approved online ticket with a verified payment capture. telegramUrl is the separate VIP invitation and is returned only to VIP owners.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid input
        "401":
          description: Missing or invalid booking capability or Firebase token
        "403":
          description: Administrator access required
        "404":
          description: Registration not found
        "409":
          description: Invalid payment or registration state
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    eventGuest:
      type: apiKey
      in: header
      name: Authorization
      description: "Guest <256-bit random hex capability>; identifies only the browser's bookings and never grants administrator access."
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    PayPalWebhookEvent:
      type: object
      additionalProperties: true
      required: [id, event_type]
      properties:
        id:
          type: string
        event_type:
          type: string
        resource:
          type: object
          additionalProperties: true
    EventActionRequest:
      type: object
      additionalProperties: true
      required: [action]
      properties:
        action:
          type: string
          enum: [mine, register-cliq, create-order, capture-order, review, retry-email, retry-admin-email, email-readiness, arrival, get-private-email-settings, save-private-email-settings]
        whatsapp:
          $ref: "#/components/schemas/EventWhatsAppSettings"
        kind:
          type: string
          enum: [booking, vip]
          description: Administrator-only retry-admin-email notification kind.
        arrived:
          type: boolean
          description: Administrator-only arrival action; requires an approved in-person base ticket when true.
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Required for arrival actions; missing legacy arrivalRevision is zero. Stale changes return 409; repeated check-ins return already-arrived without replacing the original arrival.
        tier:
          type: string
          enum: [online, vip]
        registrationId:
          type: string
        orderId:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        receiptDataUrl:
          type: string
        status:
          type: string
          enum: [approved, rejected]
    EventWhatsAppSettings:
      type: object
      additionalProperties: false
      required: [enabled, url, invitation, buttonLabel, revision]
      properties:
        enabled:
          type: boolean
        url:
          type: string
          maxLength: 2048
          description: Private HTTPS WhatsApp channel or group invitation. Administrator-only; never returned by guest endpoints.
        invitation:
          type: string
          maxLength: 1200
        buttonLabel:
          type: string
          minLength: 1
          maxLength: 80
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

